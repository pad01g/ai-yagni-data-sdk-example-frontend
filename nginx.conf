# SPA の静的ファイルを配り、/api を backend-rust に渡す。SSR はしない。
# このファイルは conf.d に置かれ、http ブロックの中で読まれる（map と limit_req_zone はここに書ける）。

# ログインと登録は、送り元の IP ごとに 1 分 10 回まで（パスワードの総当たりを遅くする）。
# この nginx の前にロードバランサーなどを置くときは、本当の送り元の IP で数えるように、server の中で
#   set_real_ip_from <前に置いたものの IP の範囲>;  real_ip_header X-Forwarded-For;
# を設定する（設定しないと、全員が前に置いたものの IP 1 つで数えられ、誰かの連打で全員がログインできなくなる）。
# 手元の compose では、ホストからの依頼が docker のゲートウェイの IP から来るので、全員で 1 つの枠になる。
# メールごとの失敗の数と、顧客ごとの注文の数は、proxy が別に数える。
# キーが空の依頼は数えないので、ほかの /api には効かない。$uri は復号・正規化したあとのパス。
map $uri $auth_limit_key {
  ~^/api/(login|signup)/?$  $binary_remote_addr;
  default                   "";
}
limit_req_zone $auth_limit_key zone=auth:10m rate=10r/m;

# キャッシュ: ファイル名にハッシュの付く /assets/ はずっと、index.html などは毎回確かめる。
# /api の応答には付けない（空の値のヘッダーは送られない）。
map $uri $cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  ~^/api/     "";
  default     "no-cache";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # compose の DNS。backend のコンテナが作り直されて IP が変わっても、10 秒で引き直す。
  # proxy_pass に変数を使うので、起動のときに backend が無くても nginx は起動する。
  resolver 127.0.0.11 valid=10s;

  # location の中で add_header を使うとここの分が引き継がれなくなるので、location では使わない
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Cache-Control $cache_control;

  location /api/ {
    limit_req zone=auth burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;

    # 変数で URI を付けずに渡すので、パスは /api/... のまま backend に届く
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    # この nginx が入口なので、送り元の言う X-Forwarded-For は信じずに置き換える
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
